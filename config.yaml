# Paper Research Agent 配置（Python 包与 pa 命令保持兼容）
# 切换 LLM 平台：改 base_url 和 model；API Key 一律放 .env，不写进本文件。

llm:
  # 默认模型端点；需自行配置密钥与额度。
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V3.2
  thinking: false  # 演示优先响应速度，结构化提取与问答不消耗额外思考预算
  api_key_env: LLM_API_KEY

embedding:
  # 中英多语嵌入；可用性、上下文与收费以端点实际配置为准。
  base_url: https://api.siliconflow.cn/v1
  model: BAAI/bge-m3
  api_key_env: LLM_API_KEY

# 网络：访问被屏蔽的数据源（如 arXiv）时填本地代理，例如 http://127.0.0.1:7890；留空直连
proxy: ""

# 文献数据源（M1）：源不可达时自动降级跳过，不中断流水线
sources:
  openalex:
    enabled: true
    email: ""            # 选填联系邮箱；额度认证使用 .env 的 OPENALEX_API_KEY
  europepmc:
    enabled: true
  arxiv:
    enabled: true        # 无代理且被屏蔽时，搜索自动降级并在结果中标注

# 无人值守与下载预算（M4 使用）
pipeline:
  top_n: 5
  year_from: 2020
  download_budget: 10

# Agent 护栏：作用域与工具上限强制执行；token 预算在下一轮决策前检查
agent:
  max_steps: 8            # 工具调用步数熔断（触顶后强制无工具总结）
  token_budget: 120000    # 已报告对话用量软预算；工具内部与最后总结可超出，不是费用硬上限
  context_keep_steps: 4   # 上下文滑动窗口（M28）：最近 N 步工具结果原样保留，更早的压成摘要桩；0 = 关闭压缩
  add_cap: 20             # add_papers 单次入库上限（超出直接拒绝，要求分批）
  confirm_threshold: 5    # 单次入库达到该数量需人工确认（HITL 钩子）

# 个人文献库核心检索：向量 + BM25 → RRF → BGE 重排序。
retrieval:
  hybrid: true
  candidate_k: 20
  min_rerank_score: 0.1  # 仅在重排序成功时使用；低于阈值明确拒答

reranker:
  enabled: true
  base_url: https://api.siliconflow.cn/v1
  model: BAAI/bge-reranker-v2-m3
  api_key_env: LLM_API_KEY

data_dir: data
